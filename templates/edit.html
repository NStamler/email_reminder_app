<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Preferences</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2>Edit Your Reminder Settings</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-success">
        {{ messages[0] }}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" action="/update/{{ token }}">
    <div class="mb-3">
      <label>Email address:</label>
      <input type="email" value="{{ user['email'] }}" class="form-control" readonly>
    </div>

    <div class="mb-3">
      <label>Days before event to remind:</label>
      <input type="number" name="days_before" value="{{ user['days_before'] }}" min="0" max="30" class="form-control">
    </div>

    <div class="mb-3">
      <label>Time of day to receive daily reminders:</label>
      <input type="time" name="time_of_day" value="{{ user['time_of_day'] }}" class="form-control">
    </div>

    <hr>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="digest" id="digestToggle" {% if user['digest'] %}checked{% endif %}>
      <label class="form-check-label" for="digestToggle">Send me a weekly digest</label>
    </div>

    <div class="mb-3">
      <label>Day of the week for digest:</label>
      <select name="digest_day" class="form-select">
        {% for day in ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}
          <option value="{{ day }}" {% if user['digest_day'] == day %}selected{% endif %}>{{ day }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Time of day for digest:</label>
      <input type="time" name="digest_time" value="{{ user['digest_time'] }}" class="form-control">
    </div>

    <div class="mb-3">
      <label>Digest includes events from:</label>
      <select name="digest_range" class="form-select">
        <option value="upcoming" {% if user['digest_range'] == 'upcoming' %}selected{% endif %}>Upcoming Week</option>
        <option value="past" {% if user['digest_range'] == 'past' %}selected{% endif %}>Past Week</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Update</button>
    <a href="/unsubscribe/{{ token }}" class="btn btn-danger float-end">Unsubscribe</a>
  </form>
</div>
</body>
</html>
