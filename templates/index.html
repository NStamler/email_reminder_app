<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Reminder Signup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="mb-4">Sign up for Event Reminders</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-info">
        {{ messages[0] }}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" action="/signup">
    <div class="mb-3">
      <label>Email address:</label>
      <input type="email" name="email" required class="form-control">
    </div>

    <div class="mb-3">
      <label>Remind me this many days before each event:</label>
      <input type="number" name="days_before" value="7" min="0" max="30" class="form-control">
    </div>

    <div class="mb-3">
      <label>Time of day to receive daily reminders:</label>
      <input type="time" name="time_of_day" value="08:00" class="form-control">
    </div>

    <hr>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="digest" id="digestToggle">
      <label class="form-check-label" for="digestToggle">Also send me a weekly digest</label>
    </div>

    <div class="mb-3">
      <label>Day of the week for digest:</label>
      <select name="digest_day" class="form-select">
        <option>Sunday</option><option>Monday</option><option>Tuesday</option>
        <option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Time of day for digest:</label>
      <input type="time" name="digest_time" value="08:00" class="form-control">
    </div>

    <div class="mb-3">
      <label>Digest includes events from:</label>
      <select name="digest_range" class="form-select">
        <option value="upcoming">Upcoming Week</option>
        <option value="past">Past Week</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>
</div>
</body>
</html>
